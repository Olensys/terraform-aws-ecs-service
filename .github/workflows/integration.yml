# `common` modules (no cloud provider) should delete this workflow.
name: integration
on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tftest.hcl'
      - '.terraform-version'
      - '.opentofu-version'
      - '.github/workflows/integration.yml'
  schedule:
    - cron: '0 3 * * 0'   # weekly drift check, Sunday 03:00 UTC
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  integration:
    uses: Olensys/terraform-workflows/.github/workflows/module-integration.yml@v1
    with:
      cloud: aws
    secrets: inherit
